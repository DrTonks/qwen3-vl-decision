[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-decision-lab"
version = "0.2.0"
description = "Reproducible Chinese customer-support decision experiments"
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = []

[project.scripts]
qwen-lab = "qwenlab.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
